name: MLOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q
      - name: Train models and record experiment artifacts
        run: |
          python -m src.data
          python -m src.train
      - name: Upload training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-evidence
          path: |
            artifacts/training_summary.json
            artifacts/*confusion_matrix.png
            artifacts/*roc_curve.png
          if-no-files-found: warn
